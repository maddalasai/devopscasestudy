<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookNest – {% block title %}{% endblock %}</title>
  <script>document.documentElement.className = "js";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% set ep = request.endpoint %}

  <header class="masthead">
    <div class="wrap">
      <div class="mast-top">
        <span>Issue Nº 10 · Autumn 2026</span>
        <span class="mast-tag">The personal reading tracker</span>
        <form class="mast-search" action="{{ url_for('library') }}" method="get" role="search">
          <label class="sr-only" for="nav-q">Search books</label>
          <input id="nav-q" type="search" name="q" placeholder="Search the shelves">
        </form>
      </div>
      <a class="logo" href="{{ url_for('index') }}">Book<em>Nest</em></a>
      <nav class="nav" aria-label="Main">
        <a href="{{ url_for('index') }}" {% if ep == 'index' %}aria-current="page"{% endif %}>Dashboard</a>
        <a href="{{ url_for('library') }}" {% if ep == 'library' %}aria-current="page"{% endif %}>My Library</a>
        <a href="{{ url_for('add_book') }}" {% if ep == 'add_book' %}aria-current="page"{% endif %}>Add a Book</a>
        <a href="{{ url_for('goals') }}" {% if ep == 'goals' %}aria-current="page"{% endif %}>Reading Goals</a>
        <a href="{{ url_for('journal_page') }}" {% if ep == 'journal_page' %}aria-current="page"{% endif %}>Journal</a>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="footer-logo">Book<em>Nest</em></p>
      <p class="footer-line">Keep the stories that <em>keep you.</em></p>
      <p class="footer-small">A personal reading tracker · Flask DevOps case study</p>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
