apiVersion: apps/v1
kind: Deployment
metadata:
  name: booknest-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booknest
  template:
    metadata:
      labels:
        app: booknest
    spec:
      containers:
        - name: booknest
          image: YOUR_DOCKERHUB_USERNAME/booknest-reading-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
